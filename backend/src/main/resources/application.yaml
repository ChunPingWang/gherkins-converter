spring:
  application:
    name: llm-agent-backend
  # 持久化(WP1-T3):預設 in-memory;啟用 postgres profile 改用 PostgreSQL + Flyway。
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/llmagent}
    username: ${POSTGRES_USER:llmagent}
    password: ${POSTGRES_PASSWORD:llmagent}
  flyway:
    enabled: false
  ai:
    openai:
      # ICA OpenAI-Compatible Gateway。base-url 後接 /v1/chat/completions。
      base-url: ${ICA_API_URL}
      api-key: ${ICA_CLAUDE_KEY}
      chat:
        options:
          model: ${llmagent.chat.default-model-id}
          # ICA(litellm)對 Claude 僅接受 temperature=1;覆寫 Spring AI 預設 0.7 以免 400。
          temperature: 1.0
          # 提高輸出上限,避免完整程式碼/文件產出被預設 4096 截斷(ICA 對 claude-opus-4-8 可達 64000)。
          max-tokens: 32000
      # 平台僅用 chat;避免 embedding 自動設定要求額外參數。
      embedding:
        enabled: false
    # MCP client 改由 MuralMcpToolProvider 自管(參數可於 UI 執行期修改);停用 starter 自動設定。
    mcp:
      client:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      # 預設(in-memory 模式)不檢查 DB;postgres profile 開啟。
      enabled: false
  tracing:
    # 預設關閉;otel profile 開啟(WP4-T4,ADR-007)。
    enabled: false

# Provider 設定(ADR-001)。apiKey 一律以環境變數參照,禁止明碼(CLAUDE.md #8)。
# ICA 為 OpenAI-Compatible Gateway;預設模型使用 ICA 最新 Claude。
llmagent:
  # Mural MCP(原理 9):初始值來自環境變數,之後可於 UI ⚙ 設定執行期修改(僅存記憶體,金鑰不落地)。
  # 前置:npm -g 安裝 bun;一次性 OAuth(--auth)token 在 ~/.mural-mcp/tokens.json。
  mcp:
    mural:
      enabled: ${LLMAGENT_MCP_ENABLED:false}
      client-id: ${MURAL_CLIENT_ID:}
      client-secret: ${MURAL_CLIENT_SECRET:}
  # Langfuse Prompt Management(WP4-T5;未設定 = 停用,自動 fallback DB)
  langfuse:
    host: ${LANGFUSE_HOST:}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
  cors:
    allowed-origins: "http://localhost:5173"
  chat:
    # ICA 可用 Claude 中最新旗艦。
    default-model-id: claude-opus-4-8
    # 全域預設 system prompt 已與設定檔隔離,存於 classpath:/seed/prompts/default-system-prompt.md
    # (未設定本屬性時由 ChatProperties 自該檔載入;內建 Agent prompt 同樣在 /seed/prompts/)。
  providers:
    ica:
      type: OPENAI_COMPATIBLE
      base-url: ${ICA_API_URL}/v1
      api-key: ${ICA_CLAUDE_KEY}
      default-model: claude-opus-4-8
