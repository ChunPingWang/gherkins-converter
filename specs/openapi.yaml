openapi: 3.0.3
info:
  title: LLM Agent Web Platform API
  version: 0.1.0
  description: >
    契約先行(ADR 見 docs/adr)。新端點先改本檔再實作。
    SSE 事件 schema 定義於 components(x-sse-events)。

paths:
  /api/providers:
    get:
      summary: 列出 Provider
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Provider" }
    post:
      summary: 新增 Provider
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCreate" }
      responses:
        "201": { description: Created }

  /api/providers/{providerId}/models:
    get:
      summary: 動態拉取模型清單(Ollama /api/tags 或 OpenAI /v1/models)
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelInfo" }

  /api/agent-profiles:
    get:
      summary: 列出 Agent Profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentProfile" }
    post:
      summary: 建立 Agent Profile(version=1)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileCreate" }
      responses:
        "201": { description: Created }

  /api/agent-profiles/{profileId}:
    put:
      summary: 更新 Agent Profile(prompt 變更 → 產生新 version,append-only)
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileCreate" }
      responses:
        "200": { description: OK,回傳含新 version }

  /api/agent-profiles/{profileId}/versions:
    get:
      summary: Prompt 版本歷史(完整內容,含 createdAt)
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /api/agent-profiles/{profileId}/versions/{version}/restore:
    post:
      summary: 還原至指定版本:以該版全部內容 append 為最新版本(版本鏈不回退,還原本身可再被還原)
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 還原後的最新版本 }

  /api/conversations:
    post:
      summary: 建立對話
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agentProfileId, modelId]
              properties:
                title: { type: string }
                agentProfileId: { type: string }
                modelId: { type: string }
                promptVariables:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201": { description: Created }

  /api/conversations/{conversationId}:
    delete:
      summary: 清除對話與產出物(重新開始)。訊息與產出物一併刪除;稽核日誌保留。冪等,不存在亦回 204。
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: No Content }

  /api/conversations/{conversationId}/messages:
    post:
      summary: 送出使用者訊息(回傳 messageId,串流另走 /stream)
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                modelId: { type: string, description: 覆寫本則訊息使用之模型(對話中切換,WP3-T3) }
                agentProfileId: { type: string, description: 對話中切換 Agent }
                promptVariables:
                  type: object
                  additionalProperties: { type: string }
                fileIds:
                  type: array
                  items: { type: string }
                  description: 對話附件(先經 /api/files 上傳)。後端抽取文字(.docx/.txt/.md/.feature)併入使用者訊息供模型參考
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId: { type: string }

  /api/messages/{messageId}/stream:
    get:
      summary: SSE 串流(text/event-stream;支援 Last-Event-ID 重連)
      description: |
        事件型別固定五種(ADR-003):
        - thinking:{"delta": string}
        - content: {"delta": string}
        - tool_call:{"name": string, "arguments": object, "status": "started|finished|error"}
        - log:     {"level":"INFO|WARN|ERROR","source":string,"msg":string,"ts":string}
        - done:    {"usage":{"promptTokens":int,"completionTokens":int},"elapsedMs":int,"ttftMs":int}
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: event-stream
          content:
            text/event-stream: {}

  /api/messages/{messageId}/artifacts:
    get:
      summary: 該訊息之產出物
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }

  /api/artifacts/{artifactId}/download:
    get:
      summary: 下載產出物
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string } }
        - name: format
          in: query
          schema: { type: string, enum: [feature, java, md, docx] }
      responses:
        "200": { description: 檔案串流 }

  /api/files:
    post:
      summary: 上傳附件(.docx 等)→ MinIO
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: 回傳 fileId 與 previewUrl }

  /api/files/{fileId}/preview:
    get:
      summary: 取得預覽用 pre-signed URL(前端 docx-preview 消費,ADR-004)
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }


  /api/providers/{providerId}/test:
    post:
      summary: Provider 連線測試(WP2-T5;3s 逾時快速失敗)
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{ok, latencyMs, models, error}"

  /api/route:
    post:
      summary: Agent 自動路由(層次一):以輕量 LLM 呼叫判斷訊息意圖,回傳決策物件。target 預留 PIPELINE 給層次二流程編排;無法判斷/解析失敗一律降級 NONE(前端退回人工選擇)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: 使用者訊息 }
      responses:
        "200":
          description: "{target: AGENT|PIPELINE|NONE, agentProfileId, agentName, confidence: 0~1, reason}"

  /api/conversations/{conversationId}/orchestrate:
    post:
      summary: 層次二 Orchestrator:於同一對話啟動 SDLC 流水線(BDD 規格 → BRD 業務文件 → Java 產碼 → Code Review),建立步驟 1 訊息並回傳 messageId 與步驟清單;串流見 /orchestrate/stream
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: 全流程目標(可含 Mural 看板 URL) }
                promptVariables:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: "{messageId, steps: [Agent 名稱…]}"

  /api/messages/{messageId}/orchestrate/stream:
    get:
      summary: 流水線單一 SSE 串流(messageId 為 orchestrate 回傳者)。事件同五型協定;步驟邊界以 content 標題與 source=orchestrator 的 log 呈現;中間步驟 done 轉 log,僅最終步驟發 done;步驟 1 無 Gherkin 產出時 ERROR log + done 優雅中止
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: text/event-stream }

  /api/settings:
    get:
      summary: 執行期設定(system prompt / base URL / token 遮罩 / Mural MCP / Git 整合)
      responses:
        "200":
          description: "{systemPrompt, baseUrl, apiKeyMasked, defaultModelId, mural:{enabled, clientId, clientSecretMasked, connected, toolCount}, git:{repoUrl, tokenMasked}}"
    put:
      summary: 更新執行期設定(空欄位=不變;僅存記憶體,金鑰不落地)。mural:{enabled, clientId, clientSecret};git:{repoUrl, token}(僅支援 github.com,GitLab 規劃中)
      responses:
        "200": { description: OK(同 GET schema) }

  /api/conversations/{conversationId}/publish:
    post:
      summary: 依 GitFlow 發布對話產出:Gherkin 每個場景開 Issue → feature/sdlc-<conv> 分支逐檔提交產碼(路徑取自首行註解)與 feature 檔 → 開 PR 以 Closes #n 連結全部 Issues(merge 自動關單)。需先於設定填 Git Repo URL 與 Token
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{issues: [{number, url}], branch, prUrl, fileCount}"

  /api/settings/mural/test:
    post:
      summary: Mural MCP 連線測試:以目前參數啟動/重用 mcp client 並列舉工具(boundedElastic 執行,避免阻塞 event loop)
      responses:
        "200":
          description: "{ok, toolCount, error}"

  /api/docx:
    post:
      summary: 將 Markdown 轉為 .docx(Apache POI;前端 docx-preview 消費,ADR-004)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown: { type: string }
                title: { type: string }
                templateFileId: { type: string, description: Word 範本(先經 /api/files 上傳)。以範本套版:置換 {{title}},{{content}} 佔位處插入內文;無佔位則附加於範本之後 }
      responses:
        "200": { description: .docx bytes }

  /api/docx/fill:
    post:
      summary: BRD 模板套版填寫(WP:BRD 套版)。於原模板 docx 上置換佔位符、展開索引列與重複區塊、刪除填寫指引與模板使用說明章,樣式完全保留
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: 佔位符值(鍵不含大括號;索引族以 _1/_2/… 具體鍵提供,引擎自動展開 _N 列)
                scenarios:
                  type: array
                  items:
                    type: object
                    additionalProperties: { type: string }
                  description: 「需求場景」重複區塊,每元素一個場景(SC_ID/SC_NAME/…;SC_STEP_1..n 等索引鍵)
                templateFileId: { type: string, description: 自訂模板(先經 /api/files 上傳);未給則用內建 BRD 模板 }
      responses:
        "200": { description: .docx bytes(原模板樣式) }

  /api/conversations/{conversationId}/artifacts:
    get:
      summary: 該對話中某型別產出物全部版本(舊→新,供 diff,WP5-T3)
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [GHERKIN, JAVA, MARKDOWN, DOCX] } }
      responses:
        "200": { description: OK }

  /api/conversations/{conversationId}/audit-logs:
    get:
      summary: 稽核事件查詢(WP4-T3)
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

components:
  schemas:
    Provider:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [OLLAMA, OPENAI_COMPATIBLE, ANTHROPIC] }
        baseUrl: { type: string }
        enabled: { type: boolean }
    ProviderCreate:
      type: object
      required: [type, baseUrl]
      properties:
        type: { type: string, enum: [OLLAMA, OPENAI_COMPATIBLE, ANTHROPIC] }
        baseUrl: { type: string }
        apiKeyRef: { type: string, description: 環境變數/Secret 參照名,禁止明碼 }
        modelWhitelist:
          type: array
          items: { type: string }
    ModelInfo:
      type: object
      properties:
        id: { type: string }
        providerId: { type: string }
        contextLength: { type: integer }
    AgentProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        defaultModelId: { type: string }
        temperature: { type: number }
        enabled: { type: boolean }
    AgentProfileCreate:
      type: object
      required: [name, systemPrompt]
      properties:
        name: { type: string }
        description: { type: string }
        systemPrompt: { type: string, description: 可含 {project_name}、{gherkin_locale} 等變數 }
        defaultModelId: { type: string }
        temperature: { type: number }
        tools:
          type: array
          items: { type: string }
    Artifact:
      type: object
      properties:
        id: { type: string }
        messageId: { type: string }
        agentProfileVersion: { type: integer }
        type: { type: string, enum: [GHERKIN, JAVA, MARKDOWN, DOCX] }
        language: { type: string }
        version: { type: integer }
        content: { type: string }
